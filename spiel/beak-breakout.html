// ---------------------------------------------------------------- storage
function lsGet(k, d){ try { var v = window.localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { window.localStorage.setItem(k, v); } catch(e){} }
function loadHS(){ try { var a = JSON.parse(lsGet(LS_HS, "[]")); return Array.isArray(a) ? a.filter(function(e){ return e && typeof e.score === "number"; }) : []; } catch(e){ return []; } }
function saveHS(a){ lsSet(LS_HS, JSON.stringify(a)); }

// ---------------------------------------------------------------- online highscores (Supabase PostgREST, anon: select + insert only)
// Never blocks gameplay: 5 s timeout, silent fallback to the local list ("bestenliste offline").
// Automated browsers (navigator.webdriver, i.e. the Playwright test suites) never contact the live list unless the
// URL has ?hsonline=1 - highscore-test.js does that with the endpoint mocked, so tests never write to the live DB.
var HS_URL = "https://chszumqahuvcdtcxstbc.supabase.co/rest/v1/scores";
var HS_KEY = "sb_publishable_A9-EkhhMYMeZRU5T0ukXfg_KHTBSasd";   // public publishable key (browser-safe)
var LS_OHS = "beak-breakout.v1.online";
var HS_ON = !!window.fetch && (!navigator.webdriver || /[?&]hsonline=1\b/.test(location.search));
var HS_TIMEOUT = 5000;
function hsClean(s){ return String(s == null ? "" : s).replace(/[\u0000-\u001f\u007f-\u009f]/g, "").replace(/\s+/g, " ").trim().slice(0, 20); }
function hsRow(r){
  if (!r || typeof r.score !== "number" || typeof r.name !== "string") return null;
  return {id: r.id, name: hsClean(r.name) || "Spieler", score: Math.max(0, Math.round(r.score)), level: Math.max(1, Math.min(10, (r.level | 0) || 1))};
}
function loadOHS(){ try { var a = JSON.parse(lsGet(LS_OHS, "null")); return Array.isArray(a) ? a.map(hsRow).filter(Boolean).slice(0, 10) : null; } catch(e){ return null; } }
var OHS = {rows: loadOHS(), state: "idle", at: -1e9, myId: null, myRank: 0, gameNo: 0, submitted: -1, sending: false};
function hsFetch(method, query, body, headers){
  if (!HS_ON) return Promise.reject(new Error("off"));
  var h = {apikey: HS_KEY, Authorization: "Bearer " + HS_KEY};
  for (var k in headers) h[k] = headers[k];
  var ctl = window.AbortController ? new AbortController() : null, timer = null;
  var req = fetch(HS_URL + query, {method: method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: "no-store", signal: ctl ? ctl.signal : undefined})
    .then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      var range = r.headers.get("content-range");
      return r.text().then(function(t){ return {data: t ? JSON.parse(t) : null, range: range}; });
    });
  var to = new Promise(function(_, rej){ timer = setTimeout(function(){ try { if (ctl) ctl.abort(); } catch(e){} rej(new Error("timeout")); }, HS_TIMEOUT); });
  return Promise.race([req, to]).then(function(v){ clearTimeout(timer); return v; }, function(e){ clearTimeout(timer); throw e; });
}
function hsRefresh(force){
  if (!HS_ON || OHS.state === "loading") return;
  if (!force && performance.now() - OHS.at < 20000) return;   // throttle: at most every 20 s unless forced
  OHS.state = "loading";
  hsFetch("GET", "?select=id,name,score,level&order=score.desc,created_at.asc&limit=10").then(function(r){
    if (!Array.isArray(r.data)) throw new Error("bad data");
    OHS.rows = r.data.map(hsRow).filter(Boolean).slice(0, 10);
    OHS.state = "ok"; OHS.at = performance.now(); lsSet(LS_OHS, JSON.stringify(OHS.rows));
  }).catch(function(){ OHS.state = "offline"; OHS.at = performance.now(); });
}
// once per game (game over or win), only for score > 0; then the player's rank and a fresh top 10
function hsSubmit(){
  if (!HS_ON || G.score <= 0 || OHS.submitted === OHS.gameNo) return;
  OHS.submitted = OHS.gameNo; OHS.myId = null; OHS.myRank = 0; OHS.sending = true;
  var row = {name: hsClean(G.name) || "Spieler", score: Math.min(10000000, Math.max(0, Math.round(G.score))), level: Math.max(1, Math.min(10, G.level + 1))};
  var game = OHS.gameNo;
  hsFetch("POST", "?select=id", row, {"Content-Type": "application/json", Prefer: "return=representation"}).then(function(r){
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if (game !== OHS.gameNo) return;
    OHS.myId = d && d.id != null ? d.id : null;
    OHS.state = "idle"; hsRefresh(true);
    return hsFetch("GET", "?select=id&score=gt." + row.score, null, {Prefer: "count=exact", Range: "0-0"}).then(function(c){
      var m = /\/(\d+)$/.exec(c.range || ""); if (m && game === OHS.gameNo) OHS.myRank = +m[1] + 1;
    });
  }).catch(function(){ if (game === OHS.gameNo){ OHS.state = "offline"; OHS.at = performance.now(); } })
    .then(function(){ OHS.sending = false; });
}
// what the menus show: the online top 10 when available, else the local list (+ note when offline)
function hsView(){
  var online = HS_ON && OHS.rows && OHS.state !== "offline";
  if (online){
    var hl = -1; for (var i = 0; i < OHS.rows.length; i++) if (OHS.myId != null && OHS.rows[i].id === OHS.myId) hl = i;
    return {rows: OHS.rows, online: true, hl: hl, note: OHS.rows.length || OHS.state !== "loading" ? "" : "lädt …"};
  }
  return {rows: G.hs, online: false, hl: G.screen === "start" ? -1 : G.lastRank, note: HS_ON && OHS.state === "offline" ? "offline" : ""};
}
hsRefresh(true);

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var nameInput = document.getElementById("bk-spx-7q3");
var view = {scale: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0};
var safeEl = document.getElementById("safe");
var TOUCH_DEV = (navigator.maxTouchPoints || 0) > 0 || ("ontouchstart" in window);
// layout: "land" = 1920x1080 design with side panel; "port" = 1080 wide, playfield on top, stats bar below
var LAY = {mode: "land", LWc: 1920, LHc: 1080, u: 1, logo: {right: 70 + 1111 * 1168 * 1.24 / 1111, y: 54, w: 433}, pause: {x: 1864, y: 56, r: 34}, hudY: 0};
function readInsets(){
  try { var cs = getComputedStyle(safeEl);
    return {t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0};
  } catch(e){ return {t: 0, r: 0, b: 0, l: 0}; }
}
function resize(){
  var cw = window.innerWidth, ch = window.innerHeight;
  // cap the backing store: devicePixelRatio <= 2 on touch devices (<= 3 desktop) and a pixel budget
  var dpr = Math.min(window.devicePixelRatio || 1, TOUCH_DEV ? 2 : 3);
  var budget = TOUCH_DEV ? 4.5e6 : 9e6;
  if (cw * ch * dpr * dpr > budget) dpr = Math.max(1, Math.sqrt(budget / (cw * ch)));
  canvas.width = Math.max(1, Math.round(cw * dpr));
  canvas.height = Math.max(1, Math.round(ch * dpr));
  var ins = readInsets();
  var aw = Math.max(1, cw - ins.l - ins.r), ah = Math.max(1, ch - ins.t - ins.b), s;
  if (ah / aw >= 1.15){
    LAY.mode = "port"; LAY.LWc = 1080; s = aw / 1080; LAY.LHc = ah / s;
    if (LAY.LHc < 1250){ LAY.LHc = 1250; s = Math.min(aw / 1080, ah / 1250); }
  } else {
    LAY.mode = "land"; LAY.LWc = 1920; LAY.LHc = 1080; s = Math.min(aw / 1920, ah / 1080);
  }
  view = {scale: s, ox: ins.l + (aw - LAY.LWc * s) / 2, oy: ins.t + (ah - LAY.LHc * s) / 2, dpr: dpr, cw: cw, ch: ch};
  LAY.u = clamp((TOUCH_DEV ? 0.7 : 0.5) / s, 1, 1.5);   // enlarge HUD text on small screens
  if (LAY.mode === "port"){
    var top = Math.max(16, (LAY.LHc - 1250) * 0.22);
    K = 1040 / 1111; FX = 20; FY = top + 120 + 30 * LAY.u;
    // logo right-aligned to the playfield's right edge; pause button moves to the top-left so they never overlap
    LAY.logo = {right: FX + CARD.w * K, y: top + 34, w: 400 + 80 * (LAY.u - 1)};
    var prp = Math.max(30 * LAY.u, 18 / s);   // >= 36 css px button
    LAY.pause = {x: FX + 4 + prp, y: top + 34 + 26 * LAY.u, r: prp};
    LAY.hudY = FY + CARD.h * K + 34;
  } else {
    K = 1168 * 1.24 / 1111; FX = 70; FY = 149;
    LAY.logo = {right: FX + CARD.w * K, y: 54, w: 433};   // logo right-aligned to the playfield's right edge
    // pause button in the real top-right screen corner (also when letterboxed, e.g. 4:3 iPad)
    var pr = Math.max(30 * LAY.u, 18 / s), scrR = (cw - ins.r - view.ox) / s, scrT = (ins.t - view.oy) / s;
    LAY.pause = {x: scrR - 24 - pr, y: scrT + 20 + pr, r: pr};
  }
  FOX = FX - CARD.x * K; FOY = FY - CARD.y * K;
  placeInput();
}

var SND = {ctx: null, out: null, buf: {}, want: {}, decoded: 0, failed: 0, unlocked: false, played: [], lossHist: []};
function sndInit(){
  if (SND.ctx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { SND.ctx = new AC(); } catch(e){ SND.ctx = null; return; }
  SND.out = SND.ctx.createGain(); SND.out.gain.value = 0.9; SND.out.connect(SND.ctx.destination);
  Object.keys(SND_SRC).forEach(function(name){
    try {
      var bin = atob(SND_SRC[name]), u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      var ok = function(b){
        SND.buf[name] = b; SND.decoded++;
        if (SND.want[name] && performance.now() - SND.want[name] < 600){ delete SND.want[name]; sndStart(name); }
      };
      var p = SND.ctx.decodeAudioData(u8.buffer, ok, function(){ SND.failed++; });
      if (p && p.catch) p.catch(function(){});
    } catch(e){ SND.failed++; }
  });
}
function sndUnlock(){
  sndInit();
  var c = SND.ctx; if (!c) return;
  try {
    if (c.state !== "running" && c.resume) { var r = c.resume(); if (r && r.catch) r.catch(function(){}); }
    if (!SND.unlocked){   // iOS: start a silent 1-sample buffer inside the gesture
      var b = c.createBuffer(1, 1, 22050), src = c.createBufferSource();
      src.buffer = b; src.connect(c.destination); src.start(0); SND.unlocked = true;
    }
  } catch(e){}
}
["keydown", "pointerdown", "touchend", "mousedown", "click"].forEach(function(ev){
  window.addEventListener(ev, sndUnlock, true);   // capture: runs even if a handler stops propagation (name input)
});
function sndStart(name){
  try { var src = SND.ctx.createBufferSource(); src.buffer = SND.buf[name]; src.connect(SND.out); src.start(0); } catch(e){}
}
function playSnd(name){
  SND.played.push(name); if (SND.played.length > 50) SND.played.shift();
  if (!SND.ctx) return;
  if (SND.buf[name]) sndStart(name);
  else SND.want[name] = performance.now();   // still decoding (first gesture just happened): play when ready
}
// life lost: "Nee" or "Mist" at random (50/50), never the same one three times in a row
function lossSound(){
  var h = SND.lossHist, n = Math.random() < 0.5 ? "nee" : "mist";
  if (h.length >= 2 && h[h.length - 1] === n && h[h.length - 2] === n) n = n === "nee" ? "mist" : "nee";
  h.push(n); if (h.length > 4) h.shift();
  return n;
}


// ---------------------------------------------------------------- helpers
function rr(c, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r); c.closePath();
}
function fmt(n){ return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function fitText(c, t, maxW){ if (c.measureText(t).width <= maxW) return t; while (t.length > 1 && c.measureText(t + "…").width > maxW) t = t.slice(0, -1); return t + "…"; }
var ASC = 1.011; // Nunito hhea ascent (PIL "la" anchor = ascender top)
function textTop(c, t, x, y, size){ c.textBaseline = "alphabetic"; c.fillText(t, x, y + size * ASC); }

// ---------------------------------------------------------------- game state
var G = {
  screen: "start", phase: "ready", paused: false, level: 0, score: 0, lives: 3,
  name: lsGet(LS_NAME, ""), bricks: [], obstacles: [], notches: [], solids: [], balls: [],
  paddle: {x: 640, w: PADDLE_W, tw: PADDLE_W, v: 0},
  fx: {big: 0, wide: 0, small: false, floor: false},
  clearTimer: 0, clearBonus: 0, msg: null, msgT: 0,
  parts: [], shake: 0, pulse: null, frozen: false, touchUI: false, buttons: [], menuT: null, endAt: 0,
  hs: loadHS(), lastRank: -1, time: 0, auto: false, keys: {}
};

function levelGeom(li){
  var L = LEVELS[li], nrows = L.rows.length;
  var bricks = [];
  L.rows.forEach(function(row, ri){
    var slot = 0;
    row.forEach(function(c){
      var s = (typeof c.slot === "number") ? c.slot : slot;
      bricks.push({x: BRICK_X0 + s * PITCH_X, y: BRICK_Y0 + ri * PITCH_Y, w: c.w * PITCH_X - 7, h: BH,
                   type: c.type, letter: c.letter || null, alive: true, flash: 0});
      slot = s + c.w;
    });
  });
  var obstacles = (L.obstacles || []).map(function(o){
    return {x: BRICK_X0 + o.slot * PITCH_X, y: BRICK_Y0 + nrows * PITCH_Y + 16 + (o.row_offset || 0) * PITCH_Y,
            w: o.w * PITCH_X - 8, h: o.h * PITCH_Y - 8};
  });
  var notches = [];
  var wall = L.wall || {};
  ["left_notch", "right_notch"].forEach(function(key){
    var n = wall[key]; if (!n) return;
    var s = (typeof n.start_after_rows === "number") ? n.start_after_rows : nrows;
    var T = BRICK_Y0 + s * PITCH_Y + (s < nrows ? 8 : 0);
    var B = T + n.height_bricks * PITCH_Y - 8;          // top of the bottom line
    var inner = n.inward_slots * PITCH_X;
    if (key === "left_notch") notches.push({side: "L", x: WALL_L, y: T, w: inner + 1, h: B + LW_T - T, T: T, B: B});
    else notches.push({side: "R", x: WALL_R - inner - 1, y: T, w: inner + 1, h: B + LW_T - T, T: T, B: B});
  });
  return {bricks: bricks, obstacles: obstacles, notches: notches};
}

// rounds: after level 10 the game continues at level 1, every completed round makes all balls 25 % faster (compounding)
var ROUND_MUL = 1.25;
function roundMul(){ return Math.pow(ROUND_MUL, Math.max(1, G.round || 1) - 1); }
function baseSpeed(){ return (540 + G.level * 22) * roundMul(); }
function ballRadius(){ return G.fx.big > 0 ? R_BIG : (G.fx.small ? R_SMALL : R_NORMAL); }
function ballSpeed(){ return baseSpeed() * (G.fx.big > 0 ? 0.85 : (G.fx.small ? 1.35 : 1)); }

function loadLevel(li){
  G.level = li;
  var g = levelGeom(li);
  G.bricks = g.bricks; G.obstacles = g.obstacles; G.notches = g.notches;
  G.solids = [
    {x: -200, y: -400, w: 1680, h: WALL_T + LW_T + 400},          // top frame (and everything above)
    {x: -200, y: -400, w: WALL_L + LW_T + 200, h: 2000},   // left edge of the white field (full height)
    {x: WALL_R - LW_T, y: -400, w: 200 + LW_T, h: 2000}    // right edge of the white field (full height)
  ].concat(G.notches);
  resetRound();
  G.fx.laser = 0; G.parts = []; G.pulse = null; G.shake = 0;
}
function resetRound(){
  G.fx = {big: 0, wide: 0, small: false, floor: false, laser: G.fx ? (G.fx.laser || 0) : 0};
  G.paddle.tw = PADDLE_W; G.paddle.w = PADDLE_W; G.paddle.x = 640; G.paddle.v = 0;
  G.balls = [{x: 640, y: PADDLE_Y - R_NORMAL, vx: 0, vy: 0, stuck: true}];
  G.phase = "ready";
}
function levelLabel(){ return "level " + pad2(G.level + 1) + ((G.round || 1) > 1 ? "  ·  runde " + G.round : ""); }
function startGame(li, round){
  G.round = Math.max(1, round | 0 || 1);
  G.score = 0; G.lives = 3; G.lastRank = -1; G.paused = false;
  OHS.gameNo++; OHS.myId = null; OHS.myRank = 0;
  playSnd("los-gehts");   // once per new game (not per level / relaunch)
  G.screen = "game"; showInput(false); ptrs = {}; dragId = null; G.keys = {};
  loadLevel(li || 0);
  flashMsg(levelLabel(), 2.2);
}
function flashMsg(t, d){ G.msg = t; G.msgT = d; }

function launch(){
  if (G.screen !== "game" || G.paused || G.phase !== "ready") return;
  var a = (Math.random() * 30 - 15) * Math.PI / 180, sp = ballSpeed();
  G.balls.forEach(function(b){ b.stuck = false; b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; });
  G.phase = "play"; G.msgT = Math.min(G.msgT, 0.6);
}

function destructibleLeft(){ for (var i = 0; i < G.bricks.length; i++) if (G.bricks[i].alive) return true; return false; }

function hitBrick(br, ball, noClear){
  if (!br.alive) return;
  if (br.type === "dark"){
    if (G.fx.big > 0){ br.alive = false; G.score += 30; }
    else {
      br.alive = false; G.score += 10;
      G.bricks.push({x: br.x, y: br.y, w: BW, h: BH, type: "light", letter: null, alive: true, flash: 0.15});
      G.bricks.push({x: br.x + PITCH_X, y: br.y, w: BW, h: BH, type: "light", letter: null, alive: true, flash: 0.15});
    }
  } else if (br.type === "laser"){
    br.alive = false; G.score += 50; G.fx.laser = 3; flashMsg("pure energy · laser 3×", 1.6); playSnd("pure-energy");
  } else if (br.type === "extra"){
    br.alive = false; G.score += 50; applyExtra(br.letter, ball);
  } else { br.alive = false; G.score += 10; }
  if (!noClear && G.phase === "play" && !destructibleLeft()) levelCleared();
}

// all destructible bricks gone -> short "Level geschafft!" moment (0.9 s), then next level with ball on paddle
var CLEAR_PAUSE = 0.9;
function levelCleared(){
  G.phase = "clear"; G.clearTimer = CLEAR_PAUSE;
  playSnd("prima");   // level done (incl. the last level, before the win screen)
  G.clearBonus = 100 + 100 * (G.level + 1);
  G.score += G.clearBonus;
  G.balls = [];
  G.fx = {big: 0, wide: 0, small: false, floor: false, laser: 0}; G.paddle.tw = PADDLE_W;
}

function applyExtra(letter){
  var names = {B: "B · big ball", E: "E · erde", A: "A · breiter schläger", K: "K · kleine bälle"};
  if (names[letter]) playSnd(letter.toLowerCase());
  if (letter === "B"){ G.fx.big = 10; G.fx.small = false; }
  else if (letter === "E"){ G.fx.floor = true; }
  else if (letter === "A"){ G.fx.wide = 15; G.paddle.tw = PADDLE_W * 1.5; }
  else if (letter === "K"){
    G.fx.small = true; G.fx.big = 0;
    var sp = ballSpeed();
    [-30, 30].forEach(function(d){
      var a = d * Math.PI / 180;
      G.balls.push({x: G.paddle.x, y: PADDLE_Y - R_SMALL - 1, vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp, stuck: false});
    });
  }
  flashMsg(names[letter] || letter, 1.6);
}

// circle vs AABB: returns {nx, ny, pen} or null
function circleRect(bx, by, r, R){
  var cx = clamp(bx, R.x, R.x + R.w), cy = clamp(by, R.y, R.y + R.h);
  var dx = bx - cx, dy = by - cy, d2 = dx * dx + dy * dy;
  if (d2 > r * r) return null;
  if (d2 > 1e-9){ var d = Math.sqrt(d2); return {nx: dx / d, ny: dy / d, pen: r - d}; }
  var l = bx - R.x, rr_ = R.x + R.w - bx, t = by - R.y, b = R.y + R.h - by, m = Math.min(l, rr_, t, b);
  if (m === l) return {nx: -1, ny: 0, pen: l + r};
  if (m === rr_) return {nx: 1, ny: 0, pen: rr_ + r};
  if (m === t) return {nx: 0, ny: -1, pen: t + r};
  return {nx: 0, ny: 1, pen: b + r};
}

function paddleRect(){ return {x: G.paddle.x - G.paddle.w / 2, y: PADDLE_Y, w: G.paddle.w, h: PADDLE_H}; }


function collideBall(b, r){
  for (var iter = 0; iter < 4; iter++){
    var best = null, bestPen = 0, kind = null, obj = null, i, c;
    for (i = 0; i < G.solids.length; i++){ c = circleRect(b.x, b.y, r, G.solids[i]); if (c && c.pen > bestPen){ best = c; bestPen = c.pen; kind = "solid"; obj = G.solids[i]; } }
    for (i = 0; i < G.obstacles.length; i++){ c = circleRect(b.x, b.y, r, G.obstacles[i]); if (c && c.pen > bestPen){ best = c; bestPen = c.pen; kind = "solid"; obj = G.obstacles[i]; } }
    for (i = 0; i < G.bricks.length; i++){ var br = G.bricks[i]; if (!br.alive) continue; c = circleRect(b.x, b.y, r, br); if (c && c.pen > bestPen){ best = c; bestPen = c.pen; kind = "brick"; obj = br; } }
    if (G.fx.floor && b.vy > 0){ c = circleRect(b.x, b.y, r, {x: IN_L, y: FLOOR_Y, w: IN_R - IN_L, h: FLOOR_H}); if (c && c.ny < 0 && c.pen > bestPen){ best = c; bestPen = c.pen; kind = "floor"; } }
    var pr = paddleRect();
    c = circleRect(b.x, b.y, r, pr); if (c && c.pen > bestPen){ best = c; bestPen = c.pen; kind = "paddle"; }
    if (!best) return;
    if (kind === "paddle"){
      if (b.vy > 0 && (best.ny < -0.3 || b.y < PADDLE_Y + 4)){
        var off = clamp((b.x - G.paddle.x) / (G.paddle.w / 2 + r * 0.5), -1, 1);
        var ang = off * 62 * Math.PI / 180, sp = Math.hypot(b.vx, b.vy) || ballSpeed();
        b.vx = Math.sin(ang) * sp; b.vy = -Math.cos(ang) * sp;
        b.y = PADDLE_Y - r - 0.01;
      } else {
        // side hit: push out sideways and send the ball away from the paddle
        b.x += best.nx * best.pen; b.y += best.ny * best.pen;
        if (best.nx !== 0) b.vx = Math.abs(b.vx) * (best.nx > 0 ? 1 : -1) + G.paddle.v * 0.3;
      }
      continue;
    }
    b.x += best.nx * best.pen; b.y += best.ny * best.pen;
    var dot = b.vx * best.nx + b.vy * best.ny;
    if (dot < 0){ b.vx -= 2 * dot * best.nx; b.vy -= 2 * dot * best.ny; }
    if (kind === "brick") hitBrick(obj, b);
    else if (kind === "floor"){ G.fx.floor = false; }
  }
}

function fixAngle(b, sp){
  var s = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / s * sp; b.vy = b.vy / s * sp;
  var minVy = sp * 0.26;   // never travel (almost) horizontally
  if (Math.abs(b.vy) < minVy){
    b.vy = (b.vy >= 0 ? 1 : -1) * minVy;
    b.vx = (b.vx >= 0 ? 1 : -1) * Math.sqrt(Math.max(0, sp * sp - minVy * minVy));
  }
}

function update(dt){
  G.time += dt;
  if (G.msgT > 0) G.msgT -= dt;
  if (G.screen !== "game" || G.paused) return;
  updateParts(dt);
  var p = G.paddle;
  // paddle
  var dir = (G.keys.ArrowRight ? 1 : 0) - (G.keys.ArrowLeft ? 1 : 0);
  if (G.auto) dir = autoDir();
  var target = dir * 1050;
  p.v += clamp(target - p.v, -9000 * dt, 9000 * dt);
  p.x += p.v * dt;
  if (p.w !== p.tw) p.w += clamp(p.tw - p.w, -400 * dt, 400 * dt);
  var minX = IN_L + p.w / 2, maxX = IN_R - p.w / 2;
  if (p.x < minX){ p.x = minX; p.v = 0; } if (p.x > maxX){ p.x = maxX; p.v = 0; }
  G.bricks.forEach(function(br){ if (br.flash > 0) br.flash -= dt; });

  if (G.phase === "clear"){
    G.clearTimer -= dt;
    if (G.clearTimer <= 0){
      if (G.level >= LEVELS.length - 1){   // all 10 done -> next round from level 1, balls +25 %
        G.round = (G.round || 1) + 1; loadLevel(0);
        flashMsg("runde " + G.round + "  ·  ball ×" + roundMul().toFixed(2).replace(/0$/, "").replace(".", ","), 2.8);
      }
      else { loadLevel(G.level + 1); flashMsg(levelLabel(), 2.2); }
    }
    return;
  }
  if (G.phase === "ready"){
    var r0 = ballRadius();
    G.balls.forEach(function(b){ b.x = p.x; b.y = PADDLE_Y - r0; });
    if (G.auto && G.msgT < 1.2) launch();
    return;
  }
  // effect timers
  if (G.fx.big > 0) G.fx.big = Math.max(0, G.fx.big - dt);
  if (G.fx.wide > 0){ G.fx.wide -= dt; if (G.fx.wide <= 0){ G.fx.wide = 0; p.tw = PADDLE_W; } }

  var r = ballRadius(), sp = ballSpeed();
  for (var i = 0; i < G.balls.length; i++){
    var b = G.balls[i];
    fixAngle(b, sp);
    var dist = sp * dt, n = Math.max(1, Math.ceil(dist / Math.max(1.5, r * 0.35)));
    var h = dt / n;
    for (var s = 0; s < n; s++){
      b.x += b.vx * h; b.y += b.vy * h;
      collideBall(b, r);
    }
    fixAngle(b, sp);
  }
  if (G.phase !== "play") return;   // level was cleared during this step
  // lost balls
  G.balls = G.balls.filter(function(b){ return b.y - r < 770; });
  if (G.fx.small && G.balls.length <= 1) G.fx.small = false;
  if (G.balls.length === 0){
    G.lives--;
    playSnd(lossSound());   // only when the LAST ball is gone (a life is lost), not per multi-ball
    if (G.lives <= 0){ endGame(false); return; }
    resetRound();
    flashMsg("ball verloren", 1.4);
  }
}

function autoDir(){
  // debug autopilot (?auto=1): follow the lowest falling ball
  var tgt = null;
  G.balls.forEach(function(b){ if (b.vy > 0 && (!tgt || b.y > tgt.y)) tgt = b; });
  if (!tgt) tgt = G.balls[0];
  if (!tgt) return 0;
  var off = ((G.time * 0.7) % 1 - 0.5) * G.paddle.w * 0.6;
  var d = tgt.x + off - G.paddle.x;
  return Math.abs(d) < 6 ? 0 : (d > 0 ? 1 : -1);
}

function endGame(won){
  G.screen = won ? "win" : "over";
  G.lastRank = -1; G.endAt = performance.now();
  if (G.score > 0){
    var e = {name: G.name || "Spieler", score: G.score, level: G.level + 1, round: G.round || 1, date: new Date().toISOString().slice(0, 10)};
    G.hs.push(e);
    G.hs.sort(function(a, b){ return b.score - a.score; });
    G.hs = G.hs.slice(0, 10);
    G.lastRank = G.hs.indexOf(e);
    saveHS(G.hs);
    hsSubmit();
  } else hsRefresh(false);
}
function bestHS(){   // online top score when available, else local
  var v = hsView(), b = v.online && v.rows.length ? v.rows[0].score : (G.hs.length ? G.hs[0].score : 0);
  return Math.max(b, G.screen === "game" ? G.score : 0);
}

// ---------------------------------------------------------------- input
function showInput(on){
  if (FIXNAME) on = false;
  nameInput.style.display = on ? "block" : "none";
  nameInput.style.pointerEvents = on ? "auto" : "none";
  if (on){
    nameInput.value = G.name; lastInputKey = ""; placeInput();
    // touch devices: no programmatic focus/select-all (iOS would hold a keyboard-less focused field with a text
    // selection); the player taps the field to edit or just taps "Los"
    if (!G.touchUI) setTimeout(function(){ try { if (G.screen === "start"){ nameInput.focus(); nameInput.select(); } } catch(e){} }, 0);
  } else {
    try { nameInput.setSelectionRange(0, 0); } catch(e){}
    try { var sel = window.getSelection && window.getSelection(); if (sel) sel.removeAllRanges(); } catch(e){}
    nameInput.blur();
  }
}
var INPUT_BOX = {x: 660, y: 412, w: 600, h: 66};
// menu screens are designed in 1920x1080 units and drawn with a transform (centred, enlarged on small screens)
function menuT(top, bottom){
  var m = clamp(0.55 / view.scale, 1, 1.6);
  m = Math.min(m, (LAY.LWc - 40) / 940, (LAY.LHc - 40) / (bottom - top));
  if (LAY.mode === "land" && m <= 1.0001) return {m: 1, tx: 960, ty: 540, cy: 540};
  return {m: m, tx: LAY.LWc / 2, ty: LAY.LHc / 2, cy: (top + bottom) / 2};
}
function menuToLogical(x, y){ var T = G.menuT || {m: 1, tx: 960, ty: 540, cy: 540}; return {x: T.tx + (x - 960) * T.m, y: T.ty + (y - T.cy) * T.m}; }
function logicalToMenu(x, y){ var T = G.menuT || {m: 1, tx: 960, ty: 540, cy: 540}; return {x: (x - T.tx) / T.m + 960, y: (y - T.ty) / T.m + T.cy}; }
var lastInputKey = "";
function placeInput(){
  var s = view.scale, T = G.menuT || {m: 1};
  var a = menuToLogical(INPUT_BOX.x, INPUT_BOX.y);
  var key = [a.x, a.y, s, T.m, view.ox, view.oy].join(",");
  if (key === lastInputKey) return; lastInputKey = key;
  nameInput.style.left = (view.ox + a.x * s) + "px";
  nameInput.style.top = (view.oy + a.y * s) + "px";
  nameInput.style.width = (INPUT_BOX.w * T.m * s) + "px";
  nameInput.style.height = (INPUT_BOX.h * T.m * s) + "px";
  nameInput.style.fontSize = Math.max(16, 44 * T.m * s) + "px";   // >= 16 px: iOS does not zoom on focus
  nameInput.style.borderBottomWidth = Math.max(1, 2 * T.m * s) + "px";
}
// first letter of the name upper-case (iOS keyboards also get autocapitalize="words"); rest stays as typed
function capFirst(v){ var m = /^(\s*)(\S)/.exec(v); if (!m) return v; var u = m[2].toLocaleUpperCase("de-DE"); return u === m[2] || u.length !== 1 ? v : m[1] + u + v.slice(m[0].length); }
nameInput.addEventListener("input", function(){
  var v = nameInput.value, nv = capFirst(v);
  if (nv === v) return;
  var a = nameInput.selectionStart, b = nameInput.selectionEnd;
  nameInput.value = nv;
  try { nameInput.setSelectionRange(a, b); } catch(e){}
});
function confirmStart(){
  var n = FIXNAME ? capFirst(FIXNAME) : capFirst((nameInput.value || "").trim().slice(0, 18));
  if (!n){ nameInput.focus(); flashMsg("bitte namen eingeben", 1.5); return; }
  G.name = n; if (!FIXNAME) lsSet(LS_NAME, n);
  startGame(0);
}
nameInput.addEventListener("keydown", function(e){
  if (e.key === "Enter"){ e.preventDefault(); confirmStart(); }
  e.stopPropagation();
});
window.addEventListener("keydown", function(e){
  var k = e.key;
  G.touchUI = false;
  if (k === " " || k === "Spacebar") k = "Space";
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].indexOf(k) >= 0) e.preventDefault();
  if (G.screen === "game"){
    if (k === "ArrowLeft" || k === "ArrowRight") G.keys[k] = true;
    if (k === "p" || k === "P" || k === "Escape"){ if (G.phase !== "clear") G.paused = !G.paused; G.keys = {}; return; }
    if ((k === "Space" || k === "ArrowUp") && !e.repeat){
      if (G.paused) { if (k === "Space") G.paused = false; }
      else if (G.phase === "ready") launch();
      else if (k === "Space") fireLaser();
    }
  } else if (G.screen === "over" || G.screen === "win"){
    if (k === "Enter" || k === "Space"){ startGame(0); }
    else if (k === "Escape"){ G.screen = "start"; G.msgT = 0; showInput(true); }
  } else if (G.screen === "start"){
    if (k === "Enter") confirmStart();
    else if (document.activeElement !== nameInput) nameInput.focus();
  }
});
window.addEventListener("keyup", function(e){ G.keys[e.key] = false; });
window.addEventListener("blur", function(){ ptrs = {}; dragId = null; G.keys = {}; if (G.screen === "game" && G.phase === "play") G.paused = true; });

// ---------------------------------------------------------------- touch / pointer
// drag anywhere: paddle follows the finger 1:1 (relative, clamped); a short touch without movement = tap
var TAP_MS = 250, TAP_PX = 10, ptrs = {}, dragId = null;
function toLogical(cx, cy){ return {x: (cx - view.ox) / view.scale, y: (cy - view.oy) / view.scale}; }
function movePaddleBy(d){
  var p = G.paddle; p.v = 0;
  p.x = clamp(p.x + d, IN_L + p.w / 2, IN_R - p.w / 2);
}
function inPause(lx, ly){ var P = LAY.pause; return G.touchUI && Math.hypot(lx - P.x, ly - P.y) <= Math.max(P.r + 18, 28 / view.scale); }   // >= 56 css px hit area
function hitButton(lx, ly){
  var m = logicalToMenu(lx, ly);
  for (var i = 0; i < G.buttons.length; i++){ var b = G.buttons[i]; if (m.x >= b.x - 8 && m.x <= b.x + b.w + 8 && m.y >= b.y - 8 && m.y <= b.y + b.h + 8) return b; }
  return null;
}
function onTap(cx, cy){
  var L = toLogical(cx, cy);
  if (G.screen === "game"){
    if (inPause(L.x, L.y)){ if (G.phase !== "clear") G.paused = !G.paused; G.keys = {}; return; }
    if (G.paused){ G.paused = false; return; }
    if (G.phase === "ready") launch(); else fireLaser();
  } else if (G.screen === "start"){
    var b = hitButton(L.x, L.y); if (b) b.act();   // nur der "Los"-Knopf startet
  } else {
    if (performance.now() - G.endAt < 900) return;   // guard: a laser tap must not restart right away
    var b2 = hitButton(L.x, L.y); if (b2){ b2.act(); return; }
    startGame(0);
  }
}
// forget all tracked pointers (stale ids from a touch whose up/cancel never arrived, e.g. iOS home swipe / app switch)
function resetPointers(){ ptrs = {}; dragId = null; G.keys = {}; }
canvas.addEventListener("pointerdown", function(e){
  if (e.pointerType === "touch" || e.pointerType === "pen") G.touchUI = true;
  e.preventDefault();
  if (G.screen !== "start" && document.activeElement === nameInput) showInput(false);
  // a primary pointer starts a new gesture: no other pointer of this type can still be down -> drop stale ones
  if (e.isPrimary){ for (var id in ptrs) if (ptrs[id].type === e.pointerType) delete ptrs[id]; }
  if (dragId !== null && !ptrs[dragId]) dragId = null;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  ptrs[e.pointerId] = {x0: e.clientX, y0: e.clientY, lx: e.clientX, t0: performance.now(), moved: false, type: e.pointerType};
  if (dragId === null) dragId = e.pointerId;
}, {passive: false});
canvas.addEventListener("pointermove", function(e){
  var q = ptrs[e.pointerId]; if (!q) return;
  e.preventDefault();
  var dx = e.clientX - q.lx; q.lx = e.clientX;
  if (Math.hypot(e.clientX - q.x0, e.clientY - q.y0) > TAP_PX) q.moved = true;
  if (e.pointerId === dragId && G.screen === "game" && !G.paused && G.phase !== "clear" && (q.type !== "mouse" || e.buttons)) movePaddleBy(dx / (view.scale * K));
}, {passive: false});
function endPtr(e, cancel){
  var q = ptrs[e.pointerId]; if (!q) return;
  delete ptrs[e.pointerId];
  if (e.pointerId === dragId){ var rest = Object.keys(ptrs); dragId = rest.length ? +rest[0] : null; }
  if (!cancel && !q.moved && performance.now() - q.t0 <= TAP_MS) onTap(e.clientX, e.clientY);
}
canvas.addEventListener("pointerup", function(e){ e.preventDefault(); endPtr(e, false); }, {passive: false});
canvas.addEventListener("pointercancel", function(e){ endPtr(e, true); });
canvas.addEventListener("lostpointercapture", function(e){ endPtr(e, true); });
window.addEventListener("pointerup", function(e){ if (e.target !== canvas) endPtr(e, true); });
window.addEventListener("pointercancel", function(e){ endPtr(e, true); });
document.addEventListener("touchcancel", function(){ resetPointers(); });
canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });

document.addEventListener("touchstart", function(e){ if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
["gesturestart", "gesturechange", "gestureend", "dblclick"].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, {passive: false}); });
document.addEventListener("visibilitychange", function(){ resetPointers(); if (document.hidden && G.screen === "game" && G.phase === "play") G.paused = true; });
window.addEventListener("pagehide", function(){ resetPointers(); if (G.screen === "game" && G.phase === "play") G.paused = true; });

function fieldBegin(){ ctx.save(); ctx.translate(FOX, FOY); ctx.scale(K, K); }

function drawObstacle(o){

  rr(c, o.x + 1, o.y + 1, o.w - 2, o.h - 2, 3.5); c.clip();

// "pure energy" in the BEAK tagline style: Nunito Light Italic, lowercase, wide letter spacing
function drawTagline(c, text, cx, baseline, size, col, maxW){
  c.fillStyle = col; c.textAlign = "left"; c.textBaseline = "alphabetic";
  var track, word, w, i, ch;
  for (;;){   // shrink until it fits maxW
    c.font = size + "px NunitoLI"; track = size * 0.2; word = size * 0.5; w = 0;
    for (i = 0; i < text.length; i++){ ch = text[i]; w += (ch === " " ? word : c.measureText(ch).width) + (i < text.length - 1 ? track : 0); }
    if (!maxW || w <= maxW || size <= 9) break;

  for (i = 0; i < text.length; i++){ ch = text[i]; if (ch !== " ") c.fillText(ch, x, baseline); x += (ch === " " ? word : c.measureText(ch).width) + track; }

    var e = list[i], ry = y + 10 + i * 34;
    if (i === highlight){ rr(c, cx - 290, ry, 580, 32, 16); c.fillStyle = WHITE; c.fill(); c.fillStyle = PINK; } else c.fillStyle = WHITE;
    c.font = "22px NunitoLI"; c.textAlign = "right"; c.fillText((i + 1) + ".", cx - 236, ry + 24);
    c.font = "24px NunitoSB"; c.textAlign = "left"; c.fillText(fitText(c, String(e.name), 270), cx - 220, ry + 25);   // canvas text: no markup interpretation
    if (e.level){ c.font = "20px NunitoLI"; c.textAlign = "center"; c.globalAlpha = i === highlight ? 1 : 0.85; c.fillText("level " + pad2(e.level), cx + 112, ry + 24); c.globalAlpha = 1; }
    c.font = "24px NunitoSB"; c.textAlign = "right"; c.fillText(fmt(e.score), cx + 272, ry + 25);
  }
  c.textAlign = "left";
}

function drawButton(c, b, big){
  rr(c, b.x, b.y, b.w, b.h, b.h / 2); c.fillStyle = WHITE; c.fill();
  c.fillStyle = PINK; c.font = (big ? 34 : 24) + "px NunitoSB"; c.textAlign = "center"; c.textBaseline = "alphabetic";
  c.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + (big ? 12 : 8.5));
}
function startRows(){ return 10; }   // 1.14 (Bernd 29.10.): immer 10 Einträge, Menü skaliert passend
function drawStart(){
  var c = ctx, rows = startRows();
  G.buttons = [];
  drawLogo(LW / 2, 200, 866);
  c.textAlign = "center"; c.textBaseline = "alphabetic"; c.fillStyle = WHITE;
  if (FIXNAME){ c.font = "26px NunitoLI"; c.fillText("spieler", LW / 2, 396); c.font = "44px NunitoSB"; c.fillText(capFirst(FIXNAME), LW / 2, 458); }
  else { c.font = "26px NunitoLI"; c.fillText("dein name", LW / 2, 396); }
  var los = {x: LW / 2 - 110, y: 498, w: 220, h: 62, label: "Los", act: confirmStart};
  G.buttons.push(los); drawButton(c, los, true);
  c.fillStyle = WHITE; c.textAlign = "center";
  c.font = "20px NunitoLI"; c.globalAlpha = 0.85;
  c.fillText(G.touchUI ? "ziehen: schläger bewegen  ·  tippen: ball starten / laser  ·  ‖ pause" : "Enter oder Los  ·  ← → schläger bewegen  ·  leertaste ball starten / laser  ·  p / esc pause", LW / 2, 600);
  c.globalAlpha = 1;
  if (G.msgT > 0 && G.msg){ c.font = "22px NunitoSB"; c.fillText(G.msg, LW / 2, 636); }
  drawHSList(LW / 2, 676, -1, rows);
  var nRows = Math.min(rows, hsView().rows.length || 1);
  c.fillStyle = WHITE; c.textAlign = "center"; c.font = "18px NunitoLI"; c.globalAlpha = 0.7;
  c.fillText(CREDIT, LW / 2, 676 + 30 + nRows * 34 + 46);   // small footer credit under the list
  c.globalAlpha = 1; c.textAlign = "left";
  hsRefresh(false);
}
function startBounds(){ var n = Math.min(startRows(), hsView().rows.length || 1); return [190, 676 + 30 + n * 34 + 56]; }

function endRows(){ return 10; }
function endFooterY(){
  var n = Math.min(endRows(), Math.max(1, hsView().rows.length));
  if (LAY.mode === "land" && (!G.menuT || G.menuT.m <= 1.0001)) return 1010;
  return 560 + 30 + n * 34 + 70;
}
function drawEnd(){
  var c = ctx, won = G.screen === "win";
  G.buttons = [];
  drawLogo(959.5, 54, 433);
  c.textAlign = "center"; c.textBaseline = "alphabetic"; c.fillStyle = WHITE;
  c.font = "104px NunitoSB"; c.fillText(won ? "Geschafft!" : "Game Over", LW / 2, 270);
  c.font = "26px NunitoLI"; c.fillText(won ? "alle 10 level gespielt, " + (G.name || "") : levelLabel(), LW / 2, 320);
  c.font = "24px NunitoLI"; c.fillText("score", LW / 2, 380);
  c.font = "72px NunitoSB"; c.fillText(fmt(G.score), LW / 2, 452);
  var hv = hsView(), rank = hv.online ? (OHS.myRank || (hv.hl >= 0 ? hv.hl + 1 : 0)) : G.lastRank + 1;
  if (rank === 1){ c.font = "26px NunitoSB"; c.fillText("neuer highscore!", LW / 2, 494); }
  else if (rank > 1){ c.font = "24px NunitoLI"; c.fillText("platz " + rank + " in der bestenliste", LW / 2, 494); }
  else if (hv.online && OHS.sending){ c.font = "24px NunitoLI"; c.globalAlpha = 0.8; c.fillText("wird eingetragen …", LW / 2, 494); c.globalAlpha = 1; }
  var rows = endRows(), hl = hv.hl < rows ? hv.hl : -1;
  drawHSList(LW / 2, 560, hl, rows);
  var fy = endFooterY();
  if (G.touchUI){
    var b1 = {x: LW / 2 - 250, y: fy - 44, w: 240, h: 58, label: "neues Spiel", act: function(){ startGame(0); }};
    var b2 = {x: LW / 2 + 10, y: fy - 44, w: 240, h: 58, label: "startbildschirm", act: function(){ G.screen = "start"; G.msgT = 0; showInput(true); }};
    G.buttons.push(b1, b2); drawButton(c, b1, false); drawButton(c, b2, false);
  } else {
    c.font = "24px NunitoLI"; c.textAlign = "center"; c.fillStyle = WHITE;
    c.globalAlpha = 0.7 + 0.3 * Math.sin(G.time * 3.5);
    c.fillText("Enter: neues Spiel  ·  Esc: Startbildschirm", LW / 2, fy); c.globalAlpha = 1;
  }
}
function endBounds(){ return [44, endFooterY() + 24]; }

function render(){
  var v = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PINK; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(v.scale * v.dpr, 0, 0, v.scale * v.dpr, v.ox * v.dpr, v.oy * v.dpr);
  if (G.screen === "game"){
    drawLogoRight(LAY.logo.right, LAY.logo.y, LAY.logo.w);
    drawField(); drawHUD(); drawPauseButton();
    return;
  }
  // menus: two passes for the transform (rows depend on the scale, bounds depend on rows)
  var bnd = G.screen === "start" ? startBounds() : endBounds();
  G.menuT = menuT(bnd[0], bnd[1]);
  bnd = G.screen === "start" ? startBounds() : endBounds();
  G.menuT = menuT(bnd[0], bnd[1]);
  var T = G.menuT;
  ctx.save(); ctx.translate(T.tx, T.ty); ctx.scale(T.m, T.m); ctx.translate(-960, -T.cy);
  if (G.screen === "start"){ drawStart(); placeInput(); } else drawEnd();
  ctx.restore();
}

// ---------------------------------------------------------------- main loop
var last = 0, acc = 0;
function frame(ts){
  if (!last) last = ts;
  var dt = Math.min(0.1, (ts - last) / 1000); last = ts;
  acc += dt;
  var steps = 0;
  if (G.frozen) acc = 0;
  while (acc >= STEP && steps < 12){ update(STEP); acc -= STEP; steps++; }
  if (steps >= 12) acc = 0;
  render();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- boot
G.touchUI = TOUCH_DEV && !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
resize();
var params = new URLSearchParams(window.location.search);
G.auto = params.get("auto") === "1";
var lv = parseInt(params.get("level"), 10);
function boot(){
  if (lv >= 1 && lv <= LEVELS.length){
    if (!G.name) G.name = params.get("name") || "Tester";
    startGame(lv - 1, parseInt(params.get("round"), 10) || 1);
  } else { G.screen = "start"; G.msgT = 0; showInput(true); }
  requestAnimationFrame(frame);
}
var fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
  document.fonts.load("20px NunitoLI"), document.fonts.load("20px NunitoSB"), document.fonts.load("20px Aeonis")
]).catch(function(){}) : Promise.resolve();
var timeout = new Promise(function(res){ setTimeout(res, 800); });
Promise.race([fontsReady, timeout]).then(boot);

// test / debug hooks
window.BEAK = {G: G, LEVELS: LEVELS, startGame: function(n, round){ startGame((n || 1) - 1, round); }, roundMul: roundMul, ballSpeed: function(){ return ballSpeed(); }, launch: launch,
  setAuto: function(on){ G.auto = !!on; }, setLaser: function(n){ G.fx.laser = n; }, fireLaser: fireLaser,
  freeze: function(on){ G.frozen = !!on; }, advance: function(ms){ var rem = ms / 1000; while (rem > 1e-9){ var d = Math.min(STEP, rem); update(d); rem -= d; } render(); }, applyExtra: applyExtra, endGame: endGame, OHS: OHS, hsRefresh: hsRefresh, hsView: hsView, HS_ON: HS_ON, capFirst: capFirst, ptrState: function(){ return {n: Object.keys(ptrs).length, dragId: dragId}; }, CREDIT: CREDIT, creditBox: function(){ return G.creditBox; }, hitBrick: hitBrick, SND: SND, playSnd: playSnd, lossSound: lossSound, levelCleared: levelCleared, LAY: LAY, view: function(){ return view; }, resize: resize,
  // css-pixel rect of a menu button / the pause button (for tests)
  buttonRect: function(label){ for (var i = 0; i < G.buttons.length; i++){ var b = G.buttons[i]; if (b.label === label){ var a = menuToLogical(b.x, b.y), m = G.menuT.m; return {x: view.ox + a.x * view.scale, y: view.oy + a.y * view.scale, w: b.w * m * view.scale, h: b.h * m * view.scale}; } } return null; },
  beamStopY: function(x){ return beamStopY(x); }, laserPath: function(x){ return laserPath(x, beamStopY(x)).length; },
  fieldK: function(){ return K; },
  pauseRect: function(){ var P = LAY.pause; return {x: view.ox + P.x * view.scale, y: view.oy + P.y * view.scale, r: P.r * view.scale}; }};
})();

</script>
